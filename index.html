<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um convite 招待</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3ecdf; --paper2:#ebe1cf;
    --ink:#1f1c19; --soft:#6b6257;
    --shu:#c23b2a; --shu-d:#8f2a1d;   /* vermelhão (torii / hanko) */
    --ai:#24345a;                     /* índigo */
    --card:#faf6ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow-x:hidden}
  body{
    font-family:'Zen Kaku Gothic New',system-ui,sans-serif;color:var(--ink);
    background-color:var(--paper);
    /* ondas seigaiha */
    background-image:
      radial-gradient(circle at 50% 100%, transparent 18px, rgba(36,52,90,.07) 19px, rgba(36,52,90,.07) 21px, transparent 22px, transparent 28px, rgba(36,52,90,.07) 29px, rgba(36,52,90,.07) 31px, transparent 32px),
      radial-gradient(circle at 0 50%, transparent 18px, rgba(36,52,90,.07) 19px, rgba(36,52,90,.07) 21px, transparent 22px, transparent 28px, rgba(36,52,90,.07) 29px, rgba(36,52,90,.07) 31px, transparent 32px);
    background-size:64px 32px;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    overflow-x:hidden;padding:24px;
  }
  /* sol vermelho ao fundo */
  .sun{position:fixed;width:min(70vw,520px);aspect-ratio:1;border-radius:50%;
    background:var(--shu);opacity:.12;top:50%;left:50%;transform:translate(-50%,-55%);z-index:0}
  /* pétalas de sakura */
  .layer{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  .petal{position:absolute;top:-30px;width:12px;height:12px;background:#f2c4cc;
    border-radius:12px 0 12px 0;opacity:.6;pointer-events:none;z-index:1;
    animation:fall linear infinite}
  @keyframes fall{100%{transform:translate(140px,110vh) rotate(540deg)}}

  .card{
    position:relative;z-index:2;width:min(420px,100%);
    background:var(--card);padding:46px 34px 36px;text-align:center;
    border:1px solid rgba(31,28,25,.12);
    box-shadow:0 1px 0 #fff inset,0 24px 50px -24px rgba(31,28,25,.35);
  }
  /* moldura fina interna */
  .card::before{content:"";position:absolute;inset:10px;border:1px solid rgba(194,59,42,.35);pointer-events:none}
  /* texto vertical lateral */
  .vert{position:absolute;top:28px;right:22px;writing-mode:vertical-rl;
    font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.35em;color:var(--soft)}
  .hanko{display:inline-grid;place-items:center;width:58px;height:58px;border:3px solid var(--shu);
    color:var(--shu);font-family:'Shippori Mincho',serif;font-weight:800;font-size:22px;line-height:1;
    border-radius:6px;transform:rotate(-6deg);letter-spacing:-.05em}
  .eyebrow{margin-top:18px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
    font-size:11px;color:var(--shu)}
  h1{font-family:'Shippori Mincho',serif;font-weight:700;font-size:clamp(30px,7vw,38px);
    line-height:1.2;margin:12px 0 10px}
  .intro{font-size:15px;line-height:1.65;color:var(--ink);margin:4px auto 12px;max-width:310px}
  .sub{color:var(--soft);font-size:14px;font-style:italic}
  .rule{width:46px;height:2px;background:var(--shu);margin:20px auto 0}

  .buttons{margin-top:28px;display:flex;align-items:center;justify-content:center;gap:14px;min-height:56px}
  .btn{
    width:130px;height:52px;font:700 17px 'Zen Kaku Gothic New';cursor:pointer;
    border-radius:4px;letter-spacing:.05em;transition:transform .15s, box-shadow .15s, background .2s;
  }
  .yes{color:#fff;background:var(--shu);border:0;box-shadow:0 5px 0 var(--shu-d)}
  .yes:hover{transform:translateY(-2px)}
  .yes:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shu-d)}
  .no{color:var(--ink);background:transparent;border:1.5px solid var(--ink);box-shadow:0 5px 0 rgba(31,28,25,.18)}
  .no:hover{background:rgba(31,28,25,.05)}

  .hint{margin-top:16px;font-size:13px;color:var(--soft);min-height:18px}

  /* botão quebrando */
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px) rotate(-2deg)}40%{transform:translateX(4px) rotate(2deg)}60%{transform:translateX(-3px) rotate(-1deg)}80%{transform:translateX(3px) rotate(1deg)}}
  .no.shaking{animation:shake .35s ease-in-out 2}
  .crack{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .crack path{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:80;stroke-dashoffset:80;animation:drawc .45s forwards}
  @keyframes drawc{to{stroke-dashoffset:0}}
  .half{position:absolute;background:var(--card) !important;margin:0;pointer-events:none;will-change:transform}
  .shard{position:absolute;width:5px;height:5px;background:var(--ink);pointer-events:none}

  /* revelação */
  .reveal{display:none}
  .card.accepted .ask{display:none}
  .card.accepted .reveal{display:block;animation:fade .7s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .reveal .jp{font-family:'Shippori Mincho',serif;font-size:15px;letter-spacing:.3em;color:var(--shu);margin-top:16px}
  .reveal h2{font-family:'Shippori Mincho',serif;font-size:32px;margin:6px 0 4px}
  .reveal .lead{color:var(--soft);margin-bottom:22px;font-size:15px}
  .details{display:grid;gap:0;text-align:left;border-top:1px solid rgba(31,28,25,.15)}
  .row{display:flex;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid rgba(31,28,25,.15);
    opacity:0;animation:slide .5s forwards}
  .row:nth-child(1){animation-delay:.25s}.row:nth-child(2){animation-delay:.45s}.row:nth-child(3){animation-delay:.65s}
  @keyframes slide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
  .row .kj{font-family:'Shippori Mincho',serif;font-weight:800;font-size:22px;color:var(--shu);width:34px;text-align:center}
  .row small{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
  .row b{font-size:17px;font-weight:700}
  .pickup{margin-top:22px;font-family:'Shippori Mincho',serif;font-weight:700;font-size:21px;color:var(--ink);
    opacity:0;animation:slide .6s .95s forwards}
  .secret{margin-top:10px;font-size:15px;color:var(--shu);font-weight:700;opacity:0;animation:slide .6s 1.15s forwards}
  .countdown{margin-top:8px;font-size:13px;color:var(--soft);opacity:0;animation:slide .6s 1.4s forwards}

  .confetti{position:absolute;top:-20px;pointer-events:none;animation:drop linear forwards}
  @keyframes drop{to{transform:translateY(110vh) rotate(600deg)}}

  /* celular */
  .btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  body{min-height:100dvh}
  @media (max-width:440px){
    body{padding:14px}
    .card{padding:40px 22px 30px}
    .card::before{inset:7px}
    .vert{top:20px;right:14px;font-size:12px}
    h1{font-size:27px;padding:0 14px}
    .btn{width:118px;height:50px}
    .reveal h2{font-size:28px}
    .row b{font-size:16px}
  }
</style>
</head>
<body>
<div class="sun"></div>
<div class="layer" id="bgfx" style="z-index:1"></div>
<div class="layer" id="fx" style="z-index:70"></div>

<div class="card" id="card">
  <div class="vert">ご招待</div>

  <div class="ask">
    <div class="hanko">招待</div>
    <div class="eyebrow">Um convite</div>
    <h1>Tenho um plano pra semana que vem.</h1>
    <p class="sub">Os detalhes, só se você aceitar.</p>
    <div class="rule"></div>
    <div class="buttons" id="buttons">
      <button class="btn yes" id="yes">Sim</button>
      <button class="btn no" id="no">Não</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>

  <div class="reveal">
    <div class="hanko">決定</div>
    <p class="jp">いただきます</p>
    <h2>Combinado.</h2>
    <p class="intro">Uma noite tranquila, comida boa e uma conversa sem pressa. Eu cuido de tudo.</p>
    <p class="lead">Anota aí:</p>
    <div class="details">
      <div class="row"><span class="kj">食</span><div><small>O quê</small><b id="what"></b></div></div>
      <div class="row"><span class="kj">日</span><div><small>Quando</small><b id="date"></b></div></div>
      <div class="row"><span class="kj">時</span><div><small>Horário</small><b id="time"></b></div></div>
    </div>
    <p class="pickup">Eu passo te buscar.</p>
    <p class="secret">E é claro: eu vou contar de onde eu te conheço.</p>
    <p class="countdown" id="countdown"></p>
  </div>
</div>

<script>
/* =========================================================
   CONFIG — troque aqui a data e a hora do convite
   ========================================================= */
const CONFIG = {
  oque:  "Jantar de comida japonesa",
  data:  "2026-11-27",   // AAAA-MM-DD  (sexta-feira da semana que vem)
  hora:  "19:00"         // HH:MM
};
/* ========================================================= */

const card=document.getElementById('card');
const yes=document.getElementById('yes');
const no=document.getElementById('no');
const hint=document.getElementById('hint');
const fx=document.getElementById('fx'), bgfx=document.getElementById('bgfx');

for(let i=0;i<12;i++){
  const p=document.createElement('div');p.className='petal';
  p.style.left=Math.random()*100+'vw';
  p.style.animationDuration=(8+Math.random()*8)+'s';
  p.style.animationDelay=(-Math.random()*14)+'s';
  p.style.scale=(.6+Math.random()*.7);
  bgfx.appendChild(p);
}

const [Y,M,D]=CONFIG.data.split('-').map(Number);
const [h,m]=CONFIG.hora.split(':').map(Number);
const when=new Date(Y,M-1,D,h,m);
let dataTxt=when.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
dataTxt=dataTxt.charAt(0).toUpperCase()+dataTxt.slice(1);
document.getElementById('what').textContent=CONFIG.oque;
document.getElementById('date').textContent=dataTxt;
document.getElementById('time').textContent=m?`${h}h${String(m).padStart(2,'0')}`:`${h}h`;

function countdown(){
  const diff=when-new Date();
  const el=document.getElementById('countdown');
  if(diff<=0){el.textContent='É hoje.';return}
  const d=Math.floor(diff/864e5),hh=Math.floor(diff/36e5)%24,mm=Math.floor(diff/6e4)%60;
  el.textContent=`Faltam ${d} dia${d!==1?'s':''}, ${hh}h e ${mm}min`;
}

// ---- o "Não" racha, quebra e cai da tela ----
const CRACK="M52 0 L44 30 L56 55 L46 78 L53 100";
const LEFT ="polygon(0 0,52% 0,44% 30%,56% 55%,46% 78%,53% 100%,0 100%)";
const RIGHT="polygon(52% 0,100% 0,100% 100%,53% 100%,46% 78%,56% 55%,44% 30%)";
let busy=false;
no.addEventListener('click',e=>{
  e.preventDefault();
  if(busy) return; busy=true;
  hint.textContent='';
  // 1) treme e aparece a rachadura
  no.style.position='relative';
  no.insertAdjacentHTML('beforeend',
    `<svg class="crack" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${CRACK}"/></svg>`);
  no.classList.add('shaking');

  setTimeout(()=>{
    // 2) parte em duas metades
    const r=no.getBoundingClientRect();
    const halves=[LEFT,RIGHT].map((clip,i)=>{
      const c=no.cloneNode(true);
      c.removeAttribute('id');c.classList.remove('shaking');c.classList.add('half');
      Object.assign(c.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',clipPath:clip});
      fx.appendChild(c);
      return {el:c,x:0,y:0,rot:0,vx:i?2.2:-2.2,vy:-5-Math.random()*1.5,vr:i?4:-4};
    });
    no.style.visibility='hidden';   // mantém o espaço, o "Sim" não pula
    // lascas
    const shards=[];
    for(let k=0;k<10;k++){
      const s=document.createElement('div');s.className='shard';
      s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';
      fx.appendChild(s);
      shards.push({el:s,x:0,y:0,rot:0,vx:(Math.random()-.5)*7,vy:-3-Math.random()*5,vr:(Math.random()-.5)*30});
    }
    // 3) gravidade
    const all=[...halves,...shards], G=.38, H=window.innerHeight;
    (function tick(){
      let alive=false;
      for(const p of all){
        p.vy+=G;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
        p.el.style.transform=`translate(${p.x}px,${p.y}px) rotate(${p.rot}deg)`;
        if(r.top+p.y<H+200) alive=true;
      }
      if(alive) requestAnimationFrame(tick);
      else{
        all.forEach(p=>p.el.remove());
        no.style.display='none';
        hint.textContent='O "Não" quebrou. Restou uma opção.';
      }
    })();
  },750);
});

// ---- sim ----
yes.addEventListener('click',()=>{
  card.classList.add('accepted');
  no.style.display='none';
  countdown();setInterval(countdown,30000);
  for(let i=0;i<50;i++){
    const c=document.createElement('div');c.className='confetti';
    if(Math.random()<.65){
      c.style.width=c.style.height=(9+Math.random()*8)+'px';
      c.style.background=Math.random()<.5?'#f2c4cc':'#c23b2a';
      c.style.borderRadius='12px 0 12px 0';
    }else{
      c.textContent=['🍣','🍙','🥢','🍥'][Math.floor(Math.random()*4)];
      c.style.fontSize=(16+Math.random()*12)+'px';
    }
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(2.6+Math.random()*2.5)+'s';
    c.style.animationDelay=(Math.random()*.8)+'s';
    fx.appendChild(c);
    setTimeout(()=>c.remove(),6000);
  }
});
</script>
</body>
</html>
